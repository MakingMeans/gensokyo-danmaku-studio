<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gensokyo Danmaku Studio — Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #eee;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
      }
      .hud {
        position: absolute;
        top: 12px;
        left: 12px;
        min-width: 140px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
        user-select: none;
      }
      .hud-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .hud-row span {
        opacity: 0.7;
      }
      .hud-pattern {
        margin-top: 6px;
        color: #ffb3c6;
      }
      .hud-help {
        margin-top: 4px;
        font-size: 11px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
